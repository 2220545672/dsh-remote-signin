name: ci

# The whole suite is `node --test` against a stub DOM: no browser, no build, no network,
# so it runs everywhere and finishes in well under a second. Both the oldest supported
# line and the current one, because the assets run in whatever browser the operator has
# and the server half runs in whatever Node DSH ships on.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax of every shipped file
        run: |
          set -euo pipefail
          for file in src/index.js src/claim.js assets/inpage.js; do
            node --check "${file}"
            printf 'node --check ok: %s\n' "${file}"
          done

      - name: The loader entry says insert
        # A bare row targets an existing entry by id, so the loader would warn and carry
        # on — the plugin would simply never load. Cheap to assert, silent to get wrong.
        run: |
          set -euo pipefail
          node -e '
            const { readFileSync } = require("node:fs");
            const text = readFileSync("cordis.patch.yml", "utf8");
            if (!/^\s*-\s*insert:/m.test(text)) { console.error("cordis.patch.yml must use insert:"); process.exit(1); }
            if (!/name:\s*dsh-remote-signin\s*$/m.test(text)) { console.error("cordis.patch.yml must name this package"); process.exit(1); }
            console.log("cordis.patch.yml loads dsh-remote-signin through insert:");
          '

      - name: Package manifest is coherent
        run: |
          set -euo pipefail
          node -e '
            const pkg = require("./package.json");
            const { existsSync } = require("node:fs");
            const missing = ["main", "dsh.bundle.patch"].filter((path) =>
              !existsSync(path.split(".").reduce((value, key) => value?.[key], pkg)),
            );
            if (missing.length > 0) { console.error("package.json points at missing files:", missing); process.exit(1); }
            console.log("package.json:", pkg.name, pkg.version);
          '

      - name: Tests
        run: node --test
